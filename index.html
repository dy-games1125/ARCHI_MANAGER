<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHI MANAGER</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f1f4f9;
      color: #172033;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 25px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d9dfeb;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #315efb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button.secondary {
      background: #e9edf5;
      color: #172033;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #dashboard {
      display: none;
    }

    .info {
      padding: 15px;
      margin: 20px 0;
      border-radius: 8px;
      background: #f1f4f9;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">

    <section id="loginScreen">
      <h1>ARCHI MANAGER</h1>
      <div class="subtitle">ESTIMATE WORKSPACE</div>

      <h2 id="formTitle">로그인</h2>

      <label for="email">이메일</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="이메일 입력"
      >

      <label for="password">비밀번호</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="비밀번호 입력"
      >

      <button id="submitButton" type="button">로그인</button>

      <button
        id="switchButton"
        class="secondary"
        type="button"
      >회원가입으로 변경</button>

      <div id="message" role="status"></div>
    </section>

    <section id="dashboard">
      <h1>ARCHI MANAGER</h1>
      <div class="subtitle">ESTIMATE WORKSPACE</div>

      <h2>로그인 완료</h2>

      <div class="info">
        로그인 계정
        <p id="accountEmail"></p>
      </div>

      <p>
        Supabase 로그인이 연결됐어.
        다음 단계에서 프로젝트와 견적을 계정별로 저장하도록 연결할 수 있어.
      </p>

      <button id="logoutButton" type="button">로그아웃</button>
    </section>

  </div>

  <script>
    const SUPABASE_URL =
      "https://vvawaphnvzrxrztpahys.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_9_6_k0idZ146QAHz_M_qLQ_n1HMHe6r";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: true
        }
      }
    );

    let signupMode = false;

    const loginScreen = document.getElementById("loginScreen");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");

    const submitButton = document.getElementById("submitButton");
    const switchButton = document.getElementById("switchButton");

    function showMessage(text) {
      message.textContent = text;
    }

    function changeMode() {
      signupMode = !signupMode;

      document.getElementById("formTitle").textContent =
        signupMode ? "회원가입" : "로그인";

      submitButton.textContent =
        signupMode ? "회원가입" : "로그인";

      switchButton.textContent =
        signupMode ? "로그인으로 변경" : "회원가입으로 변경";

      document.getElementById("password").autocomplete =
        signupMode ? "new-password" : "current-password";

      showMessage("");
    }

    switchButton.addEventListener("click", changeMode);

    submitButton.addEventListener("click", async () => {
      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (!email || !password) {
        showMessage("이메일과 비밀번호를 입력해 줘.");
        return;
      }

      if (password.length < 6) {
        showMessage("비밀번호는 6자 이상이어야 해.");
        return;
      }

      submitButton.disabled = true;
      showMessage("처리 중이야...");

      try {
        if (signupMode) {
          const { data, error } = await db.auth.signUp({
            email: email,
            password: password
          });

          if (error) throw error;

          if (data.session) {
            showDashboard(data.user);
          } else {
            showMessage(
              "가입 요청이 완료됐어. 이메일 인증이 필요하면 메일을 확인한 뒤 로그인해 줘."
            );
          }
        } else {
          const { data, error } =
            await db.auth.signInWithPassword({
              email: email,
              password: password
            });

          if (error) throw error;

          showDashboard(data.user);
        }
      } catch (error) {
        showMessage("오류: " + error.message);
      } finally {
        submitButton.disabled = false;
      }
    });

    function showDashboard(user) {
      loginScreen.style.display = "none";
      dashboard.style.display = "block";

      document.getElementById("accountEmail").textContent =
        user.email || "이메일 정보 없음";
    }

    document.getElementById("logoutButton")
      .addEventListener("click", async () => {
        await db.auth.signOut({ scope: "local" });

        dashboard.style.display = "none";
        loginScreen.style.display = "block";

        document.getElementById("password").value = "";

        signupMode = false;

        document.getElementById("formTitle").textContent = "로그인";
        submitButton.textContent = "로그인";
        switchButton.textContent = "회원가입으로 변경";

        showMessage("로그아웃했어. 다시 로그인해 줘.");
      });
  </script>
</body>
</html>
